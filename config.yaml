git:
  repo_path: "."           # 目标仓库本地路径（绝对或相对均可）
  remote: "origin"
  base_branch: "master"

aider:
  model: "openai/claude-opus-4.7"
  api_base_env: "FIX_BUG_API_BASE"
  api_key_env: "FIX_BUG_API_KEY"
  test_cmd: "pytest tests/ -x -q"

github:
  repo_slug: "1049861657/fix_bug"
  token_env: "GITHUB_TOKEN"

# notify: 暂不配置，修复结果自动生成到 reports/ 目录下的 txt 文件
