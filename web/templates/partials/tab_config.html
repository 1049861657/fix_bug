<!-- ══════════════════════════════════════════════
     配置管理 Tab
══════════════════════════════════════════════ -->
<div x-show="tab==='config'" class="flex-1 overflow-y-auto bg-slate-50">
  <div class="max-w-3xl mx-auto p-5 space-y-4">

    <!-- 子标签 -->
    <div class="flex gap-1 bg-white border border-slate-200 rounded-lg p-1 w-fit">
      <button @click="cfgSubTab='aider'"
              :class="cfgSubTab==='aider' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'"
              class="px-4 py-1.5 rounded-md text-xs font-medium transition-all">Aider</button>
      <button @click="cfgSubTab='repo'"
              :class="cfgSubTab==='repo' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'"
              class="px-4 py-1.5 rounded-md text-xs font-medium transition-all">仓库</button>
    </div>

    <!-- 操作反馈条 -->
    <div x-show="cfgMsg"
         :class="cfgMsgOk ? 'bg-green-50 border-green-200 text-green-700' : 'bg-red-50 border-red-200 text-red-700'"
         class="border rounded-md px-3 py-2 text-xs" x-text="cfgMsg"></div>

    <!-- ── Aider 子面板 ── -->
    <div x-show="cfgSubTab==='aider'" class="space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-[11px] text-slate-400">全局配置 · aider.yaml</span>
        <button @click="saveAiderCfg()" :disabled="cfgSaving"
                class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-md transition-colors disabled:opacity-40">
          <span x-show="!cfgSaving">保存</span><span x-show="cfgSaving">保存中…</span>
        </button>
      </div>

      <div class="bg-white border border-slate-200 rounded-lg overflow-hidden shadow-sm">
        <div class="bg-slate-50 border-b border-slate-200 px-4 py-2.5">
          <span class="text-xs font-semibold text-slate-600 uppercase tracking-wider">AI 模型</span>
        </div>
        <div class="p-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
          <div class="sm:col-span-2">
            <label class="block text-xs text-slate-500 mb-1">模型名称</label>
            <input x-model="aiderCfg.model" placeholder="claude-opus-4.7"
                   class="w-full border border-slate-200 rounded px-2.5 py-1.5 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">API Base URL</label>
            <input x-model="aiderCfg.api_base" placeholder="https://api.openai.com/v1"
                   class="w-full border border-slate-200 rounded px-2.5 py-1.5 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">API Key</label>
            <div class="relative">
              <input :type="cfgShowKey ? 'text' : 'password'" x-model="aiderCfg.api_key" placeholder="sk-..."
                     class="w-full border border-slate-200 rounded px-2.5 py-1.5 pr-10 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
              <button @click="cfgShowKey=!cfgShowKey" tabindex="-1"
                      class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-[11px]"
                      x-text="cfgShowKey ? '隐藏' : '显示'"></button>
            </div>
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">上下文窗口 (tokens)</label>
            <input x-model.number="aiderCfg.context_tokens" type="number" placeholder="200000"
                   class="w-full border border-slate-200 rounded px-2.5 py-1.5 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
      </div>
    </div>

    <!-- ── 仓库子面板 ── -->
    <div x-show="cfgSubTab==='repo'" class="space-y-3">

      <!-- 工具栏：文件选择 + 新建 + 保存 -->
      <div class="flex items-center gap-2">
        <select x-model="cfgFilename" @change="loadCfgFile()"
                class="flex-1 border border-slate-200 rounded-md px-2.5 py-1.5 text-xs text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <template x-for="c in configs" :key="c.path">
            <option :value="c.path" x-text="c.name.replace(/\.yaml$/, '')"></option>
          </template>
          <option x-show="!configs.length" value="">（无项目配置文件）</option>
        </select>
        <button @click="cfgShowNew=!cfgShowNew"
                class="text-xs border border-dashed border-slate-300 text-slate-500 hover:border-blue-400 hover:text-blue-600 px-2.5 py-1.5 rounded-md transition-colors shrink-0">
          + 新建
        </button>
        <button @click="saveCfgFile()" :disabled="cfgSaving || !cfgData"
                class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-md transition-colors disabled:opacity-40 shrink-0">
          <span x-show="!cfgSaving">保存</span><span x-show="cfgSaving">保存中…</span>
        </button>
      </div>

      <!-- 新建表单 -->
      <div x-show="cfgShowNew"
           class="flex flex-wrap gap-2 items-center bg-white border border-blue-200 rounded-lg px-4 py-3">
        <span class="text-xs text-slate-500 shrink-0">文件名：</span>
        <input x-model="cfgNewName" placeholder="payment-service"
               class="flex-1 min-w-32 border border-slate-200 rounded px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
        <span class="text-xs text-slate-500 shrink-0">类型：</span>
        <select x-model="cfgNewType"
                class="border border-slate-200 rounded px-2 py-1 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="python">Python</option>
          <option value="java">Java</option>
        </select>
        <button @click="createCfgFile()"
                class="text-xs bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-md">创建</button>
        <button @click="cfgShowNew=false" class="text-xs text-slate-400 hover:text-slate-600">取消</button>
      </div>

      <!-- 编辑区（新建时隐藏） -->
      <template x-if="cfgData && !cfgShowNew">
        <div class="space-y-3">

          <!-- 项目类型切换 -->
          <div class="bg-white border border-slate-200 rounded-lg px-4 py-3 flex items-center gap-4">
            <span class="text-xs text-slate-500 shrink-0">项目类型</span>
            <div class="flex gap-2">
              <template x-for="t in ['python','java']" :key="t">
                <button @click="setCfgType(t)"
                        :class="cfgData.type===t ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:border-blue-400'"
                        class="border rounded-md px-3 py-1 text-xs font-medium transition-colors capitalize"
                        x-text="t"></button>
              </template>
            </div>
            <span class="text-[11px] text-slate-400">切换类型会自动填充测试默认值</span>
          </div>

          <!-- Git / GitHub / GitLab -->
          <div class="bg-white border border-slate-200 rounded-lg overflow-hidden shadow-sm">
            <div class="bg-slate-50 border-b border-slate-200 px-4 py-2.5">
              <span class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Git 仓库</span>
            </div>
            <div class="p-4 grid grid-cols-1 gap-3 sm:grid-cols-2">

              <!-- 平台选择 -->
              <div class="sm:col-span-2 flex items-center gap-3">
                <span class="text-xs text-slate-500 shrink-0">代码平台</span>
                <div class="flex gap-2">
                  <template x-for="p in [{v:'github',l:'GitHub'},{v:'gitlab',l:'GitLab'}]" :key="p.v">
                    <button @click="cfgData.git.platform = p.v"
                            :class="cfgData.git.platform===p.v ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:border-blue-400'"
                            class="border rounded-md px-3 py-1 text-xs font-medium transition-colors"
                            x-text="p.l"></button>
                  </template>
                </div>
              </div>

              <div class="sm:col-span-2">
                <label class="block text-xs text-slate-500 mb-1">仓库地址 <span class="text-red-400">*</span></label>
                <input x-model="cfgData.git.repo_url"
                       :placeholder="cfgData.git.platform==='gitlab' ? 'https://gitlab.yourcompany.com/group/repo' : 'https://github.com/user/repo'"
                       class="w-full border border-slate-200 rounded px-2.5 py-1.5 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">本地克隆根目录</label>
                <input x-model="cfgData.git.clone_base_dir" placeholder="D:\fixRepo"
                       class="w-full border border-slate-200 rounded px-2.5 py-1.5 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">基础分支</label>
                <input x-model="cfgData.git.base_branch" placeholder="main"
                       class="w-full border border-slate-200 rounded px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Remote 名称</label>
                <input x-model="cfgData.git.remote" placeholder="origin"
                       class="w-full border border-slate-200 rounded px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>

              <!-- GitHub Token（仅 GitHub 平台显示） -->
              <template x-if="cfgData.git.platform === 'github'">
                <div>
                  <label class="block text-xs text-slate-500 mb-1">GitHub Token</label>
                  <div class="relative">
                    <input :type="cfgShowToken ? 'text' : 'password'" x-model="cfgData.git.github_token"
                           placeholder="ghp_xxxxxxxxxxxx"
                           class="w-full border border-slate-200 rounded px-2.5 py-1.5 pr-10 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button @click="cfgShowToken=!cfgShowToken" tabindex="-1"
                            class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-[11px]"
                            x-text="cfgShowToken ? '隐藏' : '显示'"></button>
                  </div>
                </div>
              </template>

              <!-- GitLab 专用字段（仅 GitLab 平台显示） -->
              <template x-if="cfgData.git.platform === 'gitlab'">
                <div>
                  <label class="block text-xs text-slate-500 mb-1">GitLab Token（Personal Access Token）</label>
                  <div class="relative">
                    <input :type="cfgShowToken ? 'text' : 'password'" x-model="cfgData.git.gitlab_token"
                           placeholder="glpat-xxxxxxxxxxxx"
                           class="w-full border border-slate-200 rounded px-2.5 py-1.5 pr-10 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button @click="cfgShowToken=!cfgShowToken" tabindex="-1"
                            class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-[11px]"
                            x-text="cfgShowToken ? '隐藏' : '显示'"></button>
                  </div>
                </div>
              </template>

              <!-- Git 代理（两个平台都显示；GitHub 默认填写，GitLab 内网留空） -->
              <div>
                <label class="block text-xs text-slate-500 mb-1">
                  Git 代理
                  <span class="text-slate-400 font-normal">（内网仓库留空，GitHub 等外网填写）</span>
                </label>
                <input x-model="cfgData.git.git_proxy"
                       :placeholder="cfgData.git.platform === 'github' ? 'http://127.0.0.1:7897' : ''"
                       class="w-full border border-slate-200 rounded px-2.5 py-1.5 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>

            </div>
          </div>

          <!-- 测试配置 -->
          <div class="bg-white border border-slate-200 rounded-lg overflow-hidden shadow-sm">
            <div class="bg-slate-50 border-b border-slate-200 px-4 py-2.5">
              <span class="text-xs font-semibold text-slate-600 uppercase tracking-wider">测试</span>
            </div>
            <div class="p-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
              <div class="sm:col-span-2">
                <label class="block text-xs text-slate-500 mb-1">测试命令</label>
                <input x-model="cfgData.test.cmd" placeholder="pytest tests/ -x -q"
                       class="w-full border border-slate-200 rounded px-2.5 py-1.5 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">测试框架</label>
                <input x-model="cfgData.test.framework" placeholder="pytest"
                       class="w-full border border-slate-200 rounded px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">测试目录</label>
                <input x-model="cfgData.test.dir" placeholder="tests/"
                       class="w-full border border-slate-200 rounded px-2.5 py-1.5 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>

              <!-- 高级选项折叠 -->
              <div class="sm:col-span-2">
                <button @click="cfgAdvanced=!cfgAdvanced"
                        class="text-[11px] text-slate-400 hover:text-slate-600 flex items-center gap-1">
                  <span x-text="cfgAdvanced ? '▾' : '▸'"></span>高级选项（cmd_dir · 堆栈过滤）
                </button>
              </div>
              <template x-if="cfgAdvanced">
                <div class="sm:col-span-2 grid grid-cols-1 gap-3 sm:grid-cols-2 pt-1 border-t border-slate-100">
                  <div>
                    <label class="block text-xs text-slate-500 mb-1">
                      执行目录 <code class="bg-slate-100 px-1 rounded text-[10px]">cmd_dir</code>
                      <span class="text-slate-300 ml-1">Java 多模块</span>
                    </label>
                    <input x-model="cfgData.test.cmd_dir" placeholder="demo"
                           class="w-full border border-slate-200 rounded px-2.5 py-1.5 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
                  </div>
                  <div>
                    <label class="block text-xs text-slate-500 mb-1">堆栈过滤前缀 <span class="text-slate-300">留空不过滤</span></label>
                    <input x-model="cfgData.test.stack_filter" placeholder="com.example"
                           class="w-full border border-slate-200 rounded px-2.5 py-1.5 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
                  </div>
                </div>
              </template>
            </div>
          </div>

        </div>
      </template>
    </div>

  </div>
</div>
