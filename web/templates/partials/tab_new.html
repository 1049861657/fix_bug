<!-- ══════════════════════════════════════════════
     新建任务 Tab
══════════════════════════════════════════════ -->
<div x-show="tab==='new'" class="flex-1 flex min-h-0">

  <!-- 左栏：表单 -->
  <aside class="w-80 shrink-0 bg-white border-r border-slate-200 flex flex-col overflow-y-auto">
    <div class="p-4 space-y-4 flex-1">
      <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider pt-1">提交修复任务</div>

      <!-- 配置文件选择 -->
      <div>
        <label class="block text-xs text-slate-500 mb-1">配置文件</label>
        <select x-model="selectedConfig"
                class="w-full border border-slate-200 rounded-md px-2.5 py-2 text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
          <template x-for="c in configs" :key="c.path">
            <option :value="c.path" x-text="c.name.replace(/\.yaml$/, '')"></option>
          </template>
          <option x-show="!configs.length" value="">（未找到配置文件）</option>
        </select>
      </div>

      <!-- 输入模式切换 -->
      <div>
        <label class="block text-xs text-slate-500 mb-1.5">报错信息来源</label>
        <div class="grid grid-cols-2 gap-1.5">
          <button @click="inputMode='text'"
                  :class="inputMode==='text' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300'"
                  class="border rounded-md py-1.5 text-xs transition-colors">粘贴文本</button>
          <button @click="inputMode='file'"
                  :class="inputMode==='file' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300'"
                  class="border rounded-md py-1.5 text-xs transition-colors">上传文件</button>
        </div>
      </div>

      <!-- 文本粘贴 -->
      <div x-show="inputMode==='text'">
        <label class="block text-xs text-slate-500 mb-1">错误日志 / 异常堆栈</label>
        <textarea x-model="errorText" rows="12" placeholder="粘贴报错日志或异常堆栈..."
                  class="w-full border border-slate-200 rounded-md px-2.5 py-2 text-slate-700 bg-white placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs font-mono resize-none leading-relaxed"></textarea>
      </div>

      <!-- 文件上传 -->
      <div x-show="inputMode==='file'">
        <label :class="uploadedFile ? 'border-green-400 bg-green-50' : 'border-slate-200 hover:border-blue-400 hover:bg-blue-50'"
               class="flex flex-col items-center justify-center w-full h-28 border-2 border-dashed rounded-md cursor-pointer transition-colors">
          <div x-show="!uploadedFile" class="text-center">
            <div class="text-2xl text-slate-300 mb-1">↑</div>
            <div class="text-xs text-slate-400">点击或拖拽 .log / .txt 文件</div>
          </div>
          <div x-show="uploadedFile" class="text-center">
            <div class="text-lg text-green-500 mb-1">✓</div>
            <div class="text-xs text-green-600 font-medium" x-text="uploadedFile?.name"></div>
            <div class="text-[10px] text-green-500 mt-0.5">点击重新选择</div>
          </div>
          <input type="file" class="hidden" accept=".log,.txt,.out"
                 @change="uploadedFile = $event.target.files[0]">
        </label>
      </div>

      <!-- 提交按钮 -->
      <button @click="submit()" :disabled="submitting || !selectedConfig"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-md text-sm transition-colors disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <span x-show="!submitting">▶ 开始修复</span>
        <span x-show="submitting" class="flex items-center gap-2">
          <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4l3-3-3-3v4a8 8 0 00-8 8h4z"/>
          </svg>
          运行中...
        </span>
      </button>

      <!-- 提交错误提示 -->
      <div x-show="submitError"
           class="text-xs text-red-600 bg-red-50 border border-red-200 rounded-md px-3 py-2"
           x-text="submitError"></div>
    </div>

    <!-- 任务结果卡 -->
    <template x-if="currentJob">
      <div class="shrink-0 border-t border-slate-200 p-4 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-500">任务结果</span>
          <span :class="'status-'+currentJob.status"
                class="text-[11px] font-medium px-2 py-0.5 rounded-full"
                x-text="{success:'✅ 成功', failed:'❌ 失败', stopped:'⏹ 已停止', running:'⟳ 运行中', pending:'⏳ 等待'}[currentJob.status]"></span>
        </div>
        <div x-show="currentJob.branch" class="text-xs text-slate-500">
          分支：<span class="text-slate-700 font-mono" x-text="currentJob.branch"></span>
        </div>
        <a x-show="currentJob.pr_url" :href="currentJob.pr_url" target="_blank"
           class="block text-xs text-blue-600 hover:underline truncate" x-text="currentJob.pr_url"></a>
        <div x-show="(currentJob.status==='failed' || currentJob.status==='stopped') && currentJob.error_msg"
             :class="currentJob.status==='stopped' ? 'text-amber-700 bg-amber-50 border-amber-100' : 'text-red-600 bg-red-50 border-red-100'"
             class="text-xs border rounded px-2 py-1.5"
             x-text="currentJob.error_msg"></div>
      </div>
    </template>
  </aside>

  <!-- 右栏：实时日志 -->
  <div class="flex-1 flex flex-col min-w-0 bg-slate-50">

    <!-- 日志标题栏 -->
    <div class="shrink-0 bg-white border-b border-slate-200 px-4 py-2 flex items-center gap-3">
      <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">执行日志</span>

      <div x-show="currentJob" class="flex items-center gap-1.5">
        <div :class="{
               'bg-blue-500 animate-pulse': currentJob?.status==='running',
               'bg-green-500': currentJob?.status==='success',
               'bg-red-500':   currentJob?.status==='failed',
               'bg-amber-400': currentJob?.status==='stopped'
             }" class="w-2 h-2 rounded-full"></div>
        <span class="text-xs text-slate-400" x-text="currentJob?.id?.slice(0,8)+'…'"></span>
      </div>

      <div x-show="currentJob" class="flex items-center gap-1">
        <span class="text-xs font-mono"
              :class="currentJob?.status==='running' ? 'text-blue-600' : currentJob?.status==='success' ? 'text-green-600' : currentJob?.status==='stopped' ? 'text-amber-600' : 'text-red-500'"
              x-text="elapsedStr"></span>
        <span x-show="currentJob?.status==='running'" class="text-[10px] text-slate-400">elapsed</span>
      </div>

      <div x-show="currentJob?.status==='running' && lastActivityStr"
           class="flex items-center gap-1 ml-1 border-l border-slate-200 pl-3">
        <span class="text-[10px]"
              :class="lastActivityMs && (Date.now()-lastActivityMs)>15000 ? 'text-amber-500' : 'text-slate-400'"
              x-text="'活动 ' + lastActivityStr"></span>
        <span x-show="lastActivityMs && (Date.now()-lastActivityMs)>15000"
              class="text-[10px] text-amber-500 animate-pulse">· LLM 处理中</span>
      </div>

      <div class="ml-auto flex items-center gap-3">
          <!-- 停止按钮（仅运行中显示） -->
          <div x-show="currentJob?.status==='running'" class="flex items-center gap-1.5">
            <template x-if="!stopConfirm">
              <button @click="stopConfirm=true"
                      class="flex items-center gap-1 text-xs text-slate-400 hover:text-red-500 border border-slate-200 hover:border-red-300 rounded px-2 py-0.5 transition-colors">
                <span class="text-[10px]">■</span> 停止
              </button>
            </template>
            <template x-if="stopConfirm">
              <div class="flex items-center gap-1.5 bg-red-50 border border-red-200 rounded px-2 py-0.5">
                <span class="text-[11px] text-red-600 font-medium">确定停止？</span>
                <button @click="cancelJob()"
                        class="text-[11px] text-red-600 font-semibold hover:underline">停止</button>
                <span class="text-slate-300 text-[11px]">|</span>
                <button @click="stopConfirm=false"
                        class="text-[11px] text-slate-400 hover:text-slate-600">取消</button>
              </div>
            </template>
          </div>

          <label class="flex items-center gap-1.5 text-xs text-slate-500 cursor-pointer select-none">
            <input type="checkbox" x-model="autoScroll" class="rounded"> 自动滚动
          </label>
          <button @click="clearLogs()" class="text-xs text-slate-400 hover:text-slate-600 transition-colors">清空</button>
          <span class="text-xs text-slate-300" x-show="logs.length" x-text="logs.length + ' 行'"></span>
        </div>
    </div>

    <!-- 日志内容 -->
    <div x-ref="logBox" class="flex-1 overflow-y-auto p-4 font-mono text-xs">
      <div x-show="!logs.length" class="text-slate-300 select-none pt-2">等待任务启动...</div>
      <template x-for="(line, i) in logs" :key="i">
        <div :class="line.startsWith('⏳') ? 'log-wait' : {
               'log-wrap':  true,
               'log-step':  line.startsWith('Step '),
               'log-ok':    line.startsWith('✓') || line.startsWith('✅'),
               'log-err':   line.startsWith('✗') || line.startsWith('❌') || line.startsWith('[错误]') || line.includes('[ERROR]'),
               'log-warn':  line.includes('[WARN]') || line.startsWith('PR 创建失败') || line.startsWith('分支无新提交'),
               'log-sep':   line.startsWith('─') || line.startsWith('▶'),
               'text-slate-700': !line.startsWith('Step ') && !line.startsWith('✓') && !line.startsWith('✅') && !line.startsWith('✗') && !line.startsWith('❌') && !line.startsWith('[错误]') && !line.includes('[ERROR]') && !line.includes('[WARN]') && !line.startsWith('─') && !line.startsWith('▶') && !line.startsWith('PR 创建失败') && !line.startsWith('分支无新提交'),
             }"
             x-text="line || '\u00a0'"></div>
      </template>
    </div>
  </div>
</div>
